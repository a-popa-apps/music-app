<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Google tag (gtag.js) -- loaded statically here, as high in <head> as
    possible, rather than injected dynamically by the React bundle. A
    dynamically-created <script> tag (appended by analytics.ts only after
    the app mounted and consent resolved) reproducibly never delivered a
    single hit in production despite every layer checking out correct --
    consent state, the dataLayer queue, even gtag.js's own internal
    push-processing hook, all verified working -- while this exact static
    placement did. Root cause was never confirmed, but static placement is
    the one variable that fixed it. Consent Mode v2 still gates actual
    measurement: analytics_storage defaults to "denied" and only flips to
    "granted" once the cookie-consent banner is accepted (see
    CookieConsentBanner.tsx / analytics.ts), so no analytics cookie is set
    without consent -- Vite substitutes %VITE_GA_MEASUREMENT_ID% with the
    real env var at build time, and empty/unset just makes gtag.js a no-op. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=%VITE_GA_MEASUREMENT_ID%"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag("js", new Date());
      gtag("consent", "default", { analytics_storage: "denied" });
      (function () {
        try {
          if (localStorage.getItem("crateprep-analytics-consent") === "granted") {
            gtag("consent", "update", { analytics_storage: "granted" });
          }
        } catch (e) {}
      })();
      gtag("config", "%VITE_GA_MEASUREMENT_ID%", { send_page_view: false });
    </script>

    <!-- Meta Pixel -- same static-placement pattern as the gtag.js block
    above, for the same reason (see that comment): loaded here rather than
    injected by the React bundle. fbq('consent', 'revoke') is called before
    init so the pixel queues but sends nothing until consent is granted;
    analytics.ts flips it to 'grant' the moment the cookie-consent banner is
    accepted (or immediately on load for a returning visitor who already
    granted it). Same as GA's config() with send_page_view:false, this file
    never sends the PageView event itself -- analytics.ts's trackPageView()
    is the one place that does, so there's a single source of page views
    and no double-count. Empty/unset VITE_META_PIXEL_ID just makes fbq a
    harmless no-op, same as gtag.js. -->
    <script>
      !function (f, b, e, v, n, t, s) {
        if (f.fbq) return;
        n = f.fbq = function () {
          n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
        };
        if (!f._fbq) f._fbq = n;
        n.push = n;
        n.loaded = true;
        n.version = "2.0";
        n.queue = [];
        t = b.createElement(e);
        t.async = true;
        t.src = v;
        s = b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t, s);
      }(window, document, "script", "https://connect.facebook.net/en_US/fbevents.js");
      fbq("consent", "revoke");
      fbq("init", "%VITE_META_PIXEL_ID%");
      (function () {
        try {
          if (localStorage.getItem("crateprep-analytics-consent") === "granted") {
            fbq("consent", "grant");
          }
        } catch (e) {}
      })();
    </script>
    <noscript

        width="1"
        style="display: none"
        src="https://www.facebook.com/tr?id=%VITE_META_PIXEL_ID%&ev=PageView&noscript=1"
    /></noscript>
    <!-- End Meta Pixel -->
